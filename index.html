<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Volleybal Rotatiehulp</title>

:root{--b:#185adb;--g:#217a3c;--o:#d86600;--i:#172033;--m:#667085;--bg:#eef2f7;--c:#f3aa49;--d:#b42318}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--i)}.app{max-width:960px;margin:auto;padding:16px}h1{text-align:center;font-size:clamp(1.35rem,5vw,2rem);line-height:1.1;margin:0 0 4px}.sub{text-align:center;color:var(--m);margin:0 0 14px;font-size:.9rem}.card{background:#fff;border-radius:14px;padding:16px;box-shadow:0 6px 18px #10203014}.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}button{min-height:44px;border:0;border-radius:9px;padding:9px;font:inherit;font-weight:750;cursor:pointer;background:var(--b);color:#fff}.prev{background:var(--g)}.next{background:var(--o)}.ghost{background:#fff;color:var(--i);border:1px solid #cfd6e4}.danger{color:var(--d)}.status{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.stat{background:#f7f9fc;border-radius:9px;padding:8px}.label{color:var(--m);font-size:.72rem}.value{font-weight:850;font-size:.9rem}.setup{color:var(--b)}.match{color:var(--g)}.notice{margin:0 0 10px;padding:8px 10px;border-radius:9px;background:#edf4ff;color:#23406f;font-size:.8rem;line-height:1.35}.court{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,minmax(100px,1fr));gap:3px;background:#fff;border:4px solid #fff;outline:3px solid #ba6b15;border-radius:7px;overflow:hidden;position:relative}.court:after{content:"";position:absolute;left:0;right:0;top:50%;height:3px;background:#fff;pointer-events:none}.pos{color:var(--i);background:linear-gradient(145deg,#f8c47d,var(--c));border:0;border-radius:0;min-height:100px;padding:8px 3px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}.num{position:absolute;top:5px;left:6px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:#ffffffe8;font-weight:900;font-size:.75rem}.name{font-size:clamp(.8rem,3.6vw,1.2rem);font-weight:850;overflow-wrap:anywhere;line-height:1.05}.badge{margin-top:4px;color:#fff;border-radius:999px;padding:2px 6px;font-size:.58rem;font-weight:900;background:var(--b)}.r-MB{background:#6b3fa0}.r-PL{background:#0f766e}.r-DA{background:#be123c}.r-L{background:#0b4f8a}.libopt{display:flex;align-items:center;gap:8px;margin:-4px 0 10px;padding:8px 10px;background:#f7f9fc;border-radius:9px;font-size:.82rem;font-weight:750;cursor:pointer}.libopt input{width:20px;height:20px;margin:0;accent-color:var(--b)}.pos.lib{background:linear-gradient(145deg,#d6ebff,#9ccaf3)}.under{margin-top:3px;font-size:.62rem;font-weight:700;color:#6b7280;opacity:.85}.libslot{position:relative;width:100%;margin-top:6px;min-height:52px;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;color:var(--i);background:linear-gradient(145deg,#d6ebff,#9ccaf3);border-radius:7px;outline:3px solid #ba6b15;border:4px solid #fff}.libslot .name{font-size:.95rem}.libslot .role{margin:0;color:#23406f}.gray{background:#c4c9d2}.system{display:flex;gap:6px;margin-bottom:10px;padding:4px;background:#f7f9fc;border-radius:9px}.system label{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;min-height:40px;border-radius:7px;font-size:.82rem;font-weight:750;cursor:pointer;text-align:center}.system input{accent-color:var(--b);width:18px;height:18px;margin:0}.system label:has(input:checked){background:#fff;box-shadow:0 1px 4px #10203022;color:var(--b)}.role{margin-top:3px;font-size:.62rem;font-weight:800;color:#71400e}.server{box-shadow:inset 0 0 0 4px var(--g)}.changed:before,.start:before{position:absolute;right:4px;top:4px;padding:2px 4px;border-radius:999px;font-size:.5rem;font-weight:900}.changed:before{content:"WISSEL";background:#fff3cd;color:#7a4b00}.start:before{content:"START";background:#edf4ff;color:#174ea6}.legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:9px;color:var(--m);font-size:.72rem}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}.gd{background:var(--g)}.yd{background:#f2b84b}.history{margin-top:14px;border-top:1px solid #e4e7ec;padding-top:12px}.history h2{font-size:1rem;margin:0 0 7px}.list{display:grid;gap:7px}.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px;background:#f7f9fc;border-radius:8px;font-size:.82rem}.item button{min-height:36px;padding:6px 9px;font-size:.78rem}.empty{color:var(--m);font-size:.82rem}.bottom{margin-top:14px;padding-top:12px;border-top:1px solid #e4e7ec}.bottom button{width:100%}.back{position:fixed;inset:0;background:#11182794;display:none;align-items:center;justify-content:center;padding:14px;z-index:10}.back.open{display:flex}.dialog{width:min(440px,100%);background:#fff;border-radius:14px;padding:16px}.dialog h2{margin:0 0 5px;font-size:1.15rem}.dialog p{color:var(--m);margin:0 0 12px;font-size:.86rem}.input{width:100%;padding:11px;border:1px solid #cfd6e4;border-radius:8px;font-size:16px}.da{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}.err{min-height:18px;color:var(--d);font-size:.82rem;margin-top:5px}.toast{position:fixed;left:50%;bottom:14px;transform:translate(-50%,15px);background:var(--i);color:#fff;padding:9px 12px;border-radius:8px;opacity:0;transition:.2s;z-index:20;font-size:.82rem}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:430px){.app{padding:6px}.card{padding:8px;border-radius:10px}h1{font-size:1.2rem}.sub{font-size:.72rem;margin-bottom:8px}.tools{gap:5px;margin-bottom:7px}.tools button{min-height:38px;padding:5px;font-size:.78rem}.status{gap:5px;margin-bottom:7px}.stat{padding:6px}.label{font-size:.62rem}.value{font-size:.78rem}.notice{font-size:.68rem;padding:6px 7px;margin-bottom:7px}.court{grid-template-rows:repeat(2,minmax(78px,1fr));border-width:3px}.pos{min-height:78px;padding:5px 2px}.num{width:20px;height:20px;font-size:.62rem}.name{font-size:.72rem}.role{font-size:.52rem}.badge{font-size:.5rem}.legend{font-size:.62rem;gap:6px}.system label{font-size:.7rem;min-height:36px;gap:4px}.libopt{font-size:.72rem;padding:6px 8px;margin-bottom:7px}.under{font-size:.52rem}.libslot{min-height:44px}.libslot .name{font-size:.8rem}.history{margin-top:10px;padding-top:9px}.item{flex-direction:column;align-items:stretch}.bottom{margin-top:10px;padding-top:9px}.bottom button{min-height:38px;font-size:.8rem}}
</style></head><body><main class="app"><h1>🏐 Volleybal Rotatiehulp</h1><p class="sub">Tik op een positie om de startopstelling in te voeren</p><section class="card"><div class="tools"><button id="previous" class="prev">Vorige rotatie</button><button id="next" class="next">Volgende rotatie</button></div><fieldset class="system" role="radiogroup" aria-label="Spelsysteem" style="border:0"><label><input type="radio" name="system" value="4-2">4-2 · twee SV</label><label><input type="radio" name="system" value="5-1">5-1 · SV + DA</label></fieldset><label class="libopt"><input type="checkbox" id="useLibero">Spelen met libero</label><div class="status"><div class="stat"><div class="label">Modus</div><div id="mode" class="value setup">Startopstelling</div></div><div class="stat"><div class="label">Wisselhandelingen</div><div id="swaps" class="value">0</div></div></div><p id="notice" class="notice"></p><div class="court"><button class="pos" data-p="4"></button><button class="pos" data-p="3"></button><button class="pos" data-p="2"></button><button class="pos" data-p="5"></button><button class="pos" data-p="6"></button><button class="pos" data-p="1"></button></div><button id="liberoSlot" class="libslot" hidden></button><div class="legend"><span><i class="dot gd"></i>serveerder</span><span><i class="dot yd"></i>ingevallen</span><span><b>SV</b> = spelverdeler</span><span><b>MB</b> = middenblokkeerder</span><span><b>PL</b> = passer-loper</span><span id="legendDA"><b>DA</b> = diagonaal aanvaller</span><span id="legendL"><b>L</b> = libero (vervangt MB achterin)</span></div><div class="history"><h2>Actieve wissels</h2><div id="active" class="list"></div></div><div class="bottom"><button id="reset" class="ghost danger">Nieuwe startopstelling</button></div></section></main><div id="modal" class="back"><div class="dialog"><h2 id="title"></h2><p id="desc"></p><label for="player"><b id="inputLabel"></b></label><input id="player" class="input" maxlength="40" autocomplete="off"><div id="error" class="err"></div><div class="da"><button id="cancel" class="ghost">Annuleren</button><button id="save">Opslaan</button></div></div></div><div id="toast" class="toast"></div><script>
"use strict";const names={1:"rechtsachter",2:"rechtsvoor",3:"middenvoor",4:"linksvoor",5:"linksachter",6:"middenachter"};const roles={1:"SV",4:"SV",3:"MB",6:"MB",2:"PL",5:"PL"};let system="4-2";const roleFor=base=>system==="5-1"&&base===4?"DA":roles[base];const roleOf=x=>roleFor(x.base);let useLibero=false,libero=null;let team=Array(6).fill(null),setup=true,swapCount=0,selected=null,id=0;
const STORAGE_KEY="volleybal-rotatie-state-v2";
function persist(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify({team,setup,swapCount,id,system,useLibero,libero}))}catch(e){}}
function restoreState(){try{
  const raw=localStorage.getItem(STORAGE_KEY); if(!raw)return;
  const s=JSON.parse(raw);
  if(!s||!Array.isArray(s.team)||s.team.length!==6)return;
  if(s.system==="5-1"||s.system==="4-2")system=s.system;
  useLibero=!!s.useLibero; libero=typeof s.libero==="string"&&s.libero?s.libero:null;
  team=s.team.map(x=>x&&!x.role?{...x,role:roles[x.base]||(x.sv?"SV":"")}:x); setup=!!s.setup;
  swapCount=Number.isFinite(s.swapCount)?s.swapCount:0;
  const maxId=Math.max(0,...team.filter(Boolean).map(x=>Number(x.id)||0));
  id=Math.max(Number(s.id)||0,maxId);
}catch(e){}}const el=x=>document.getElementById(x);function make(name,base,original=name,role=roles[base],sub=false){return{id:++id,name:name.trim(),original:original.trim(),base,role,sub}}const liberoAt=p=>useLibero&&!!libero&&[1,5,6].includes(p)&&!!team[p-1]&&roleOf(team[p-1])==="MB";function complete(){return team.every(Boolean)}function openDialog(p){selected=p;const x=team[p-1];el("error").textContent="";if(p===7){el("title").textContent="Libero invoeren";el("desc").textContent="De libero vervangt de middenblokkeerder op positie 1, 5 of 6.";el("inputLabel").textContent="Naam libero";el("player").value=libero||"";el("save").textContent="Opslaan"}else if(setup){el("title").textContent="Startspeler invoeren";el("desc").textContent=`Positie ${p} (${names[p]}) is een ${roleFor(p)}-positie.`;el("inputLabel").textContent="Naam basisspeler";el("player").value=x?x.name:"";el("save").textContent="Opslaan"}else{el("title").textContent="Speler wisselen";el("desc").textContent=`${x.name} staat op positie ${p} (${names[p]})${liberoAt(p)?`, nu vervangen door libero ${libero}`:""}.`;el("inputLabel").textContent="Naam wisselspeler";el("player").value="";el("save").textContent="Wisselen"}el("modal").classList.add("open");setTimeout(()=>{el("player").focus();el("player").select()},0)}function close(){el("modal").classList.remove("open");selected=null}function save(){if(selected===null)return;const n=el("player").value.trim();if(!n){el("error").textContent="Voer een naam in.";return}if(team.some((x,i)=>x&&i!==selected-1&&x.name.toLowerCase()===n.toLowerCase())||(selected!==7&&libero&&useLibero&&libero.toLowerCase()===n.toLowerCase())){el("error").textContent="Deze speler staat al in het veld.";return}if(selected===7)libero=n;else if(setup)team[selected-1]=make(n,selected);else{const out=team[selected-1];team[selected-1]=make(n,out.base,out.original,out.role,true);swapCount++}persist();close();render()}function begin(){if(!complete()){pop("Vul eerst alle zes startposities in.");return false}setup=false;persist();return true}function rotate(d){if(!begin())return;team=d>0?[team[5],...team.slice(0,5)]:[...team.slice(1),team[0]];persist();render()}function restore(base){const i=team.findIndex(x=>x&&x.base===base),x=team[i];if(i<0||!x)return;team[i]=make(x.original,x.base,x.original,x.role,false);swapCount++;persist();render()}function reset(){team=Array(6).fill(null);libero=null;setup=true;swapCount=0;selected=null;id=0;persist();render()}function render(){document.querySelectorAll(".pos").forEach(b=>{const p=+b.dataset.p,x=team[p-1];b.className="pos"+(p===1&&x?" server":"")+(x?.sub?" changed":"")+(setup&&x?" start":"");if(!x){b.innerHTML=`<span class="num">${p}</span><span class="name">Tik om speler in te voeren</span><span class="role">${names[p]}</span>`;return}if(liberoAt(p)){b.classList.add("lib");b.innerHTML=`<span class="num">${p}</span><span class="name"></span><span class="badge r-L">L</span><span class="role"></span><span class="under"></span>`;b.querySelector(".name").textContent=libero;b.querySelector(".role").textContent=p===1?"🏐 Serveert":names[p];b.querySelector(".under").textContent=`${x.name} · MB`;return}b.innerHTML=`<span class="num">${p}</span><span class="name"></span><span class="badge r-${roleOf(x)}">${roleOf(x)}</span><span class="role"></span>`;b.querySelector(".name").textContent=x.name;b.querySelector(".role").textContent=p===1?"🏐 Serveert":names[p]});el("useLibero").checked=useLibero;el("legendL").hidden=!useLibero;const ls=el("liberoSlot");ls.hidden=!useLibero;if(useLibero){ls.className="libslot"+(setup&&libero?" start":"");const at=[1,5,6].find(liberoAt);ls.innerHTML=`<span class="badge r-L">L</span><span class="name"></span><span class="role"></span>`;ls.querySelector(".name").textContent=libero||"Tik om libero in te voeren";ls.querySelector(".role").textContent=!libero?"7e speler":setup?"libero":at?`in het veld op positie ${at}`:"op de bank (MB's voorin)"}document.querySelectorAll("input[name=system]").forEach(r=>r.checked=r.value===system);el("legendDA").hidden=system!=="5-1";el("swaps").textContent=swapCount;el("mode").textContent=setup?"Startopstelling":"Wedstrijdmodus";el("mode").className="value "+(setup?"setup":"match");el("notice").textContent=setup?(complete()?(useLibero&&!libero?"Opstelling compleet. Voer nog de libero in, of kies een rotatieknop om te starten.":"Opstelling compleet. Kies een rotatieknop om te starten."):`Tik op de zes posities. ${system==="5-1"?"Positie 1 wordt SV, 4 DA":"Positie 1 en 4 worden SV"}, 3 en 6 MB, 2 en 5 PL.`):"Tik op een speler om te wisselen.";renderActive()}function renderActive(){const box=el("active");box.innerHTML="";const list=team.filter(x=>x?.sub);if(!list.length){box.innerHTML='<div class="empty">Geen actieve wissels.</div>';return}list.forEach(x=>{const row=document.createElement("div"),txt=document.createElement("span"),btn=document.createElement("button");row.className="item";txt.textContent=`${x.name} voor ${x.original} (${roleOf(x)})`;btn.className="ghost";btn.textContent="Terugwisselen";btn.onclick=()=>restore(x.base);row.append(txt,btn);box.append(row)})}let timer;function pop(t){el("toast").textContent=t;el("toast").classList.add("show");clearTimeout(timer);timer=setTimeout(()=>el("toast").classList.remove("show"),1500)}document.querySelectorAll(".pos").forEach(b=>b.onclick=()=>openDialog(+b.dataset.p));el("previous").onclick=()=>rotate(1);el("next").onclick=()=>rotate(-1);el("reset").onclick=reset;el("cancel").onclick=close;el("save").onclick=save;el("player").onkeydown=e=>{if(e.key==="Enter")save();if(e.key==="Escape")close()};el("modal").onclick=e=>{if(e.target===el("modal"))close()};document.querySelectorAll("input[name=system]").forEach(r=>r.onchange=()=>{system=r.value;persist();render();pop(system==="5-1"?"5-1: positie 4 wordt diagonaal aanvaller":"4-2: twee spelverdelers")});el("useLibero").onchange=e=>{useLibero=e.target.checked;persist();render()};el("liberoSlot").onclick=()=>openDialog(7);restoreState();render();
</script><script>
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
}
</script></body></html>
